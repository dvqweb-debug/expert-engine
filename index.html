<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbox thông minh</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .chat-container {
            width: 380px;
            height: 550px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .chat-header {
            background-color: #0084ff;
            color: white;
            padding: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 16px;
        }
        .chat-box {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background-color: #fafafa;
        }
        .message {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 15px;
            font-size: 14px;
            line-height: 1.4;
        }
        .user-message {
            background-color: #0084ff;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .bot-message {
            background-color: #e4e6eb;
            color: black;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }
        .chat-input-area {
            display: flex;
            padding: 10px;
            background: white;
            border-top: 1px solid #ddd;
        }
        .chat-input-area input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 20px;
            outline: none;
            font-size: 14px;
        }
        .chat-input-area button {
            background-color: #0084ff;
            color: white;
            border: none;
            padding: 0 15px;
            margin-left: 8px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }
        .chat-input-area button:hover {
            background-color: #006edc;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">Trợ lý ảo</div>
        <div class="chat-box" id="chatBox">
            <!-- Tin nhắn chào mừng mặc định của bot -->
            <div class="message bot-message">Xin chào! Tôi có thể giúp gì cho bạn hôm nay?</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="Nhập tin nhắn..." onkeydown="handleKeyPress(event)">
            <button onclick="sendMessage()">Gửi</button>
        </div>
    </div>

    <script>
        // ==========================================
        // KHU VỰC SOẠN CÂU HỎI VÀ CÂU TRẢ LỜI CHO BOT
        // ==========================================
        function getBotResponse(input) {
            // Chuyển chữ về chữ thường và bỏ khoảng trắng thừa để dễ khớp lệnh
            input = input.toLowerCase("xin chào quý khách").trim();

            // Đặt các điều kiện câu hỏi và câu trả lời tương ứng ở đây:
            if (input.includes("phù hợp cho mùa hè") || input.includes("mùa hè")) {
                return "ô vậy là bà đang tìm đến món bán chạy nhất quán rồi. TRÀ TẮC là món rất phù hợp cho mùa hè này;
            } 
            else if (input.includes("giá") || input.includes("bao nhiêu tiền")) {
                return "hiện tại món này tại quán tui có giá 20k!";
            } 
            else if (input.includes("phù hợp cho mùa đông") || input.includes("mùa đông")) {
                return "Mùa đông thì rất phù hợp nếu bà thử mì cay.";
            } 
            else if (input.includes("ai là người phát triển bạn") || input.includes("ai tạo ra bạn") || input.includes("chủ của bạn là ai")) {
                return "Tui là một chatbox thông minh được phát triển từ Atlat(Quân) để phục vụ cho web gọi món của Vịt(Vy).";
            }
            
            // Câu trả lời mặc định nếu bot không hiểu ý người dùng
            return "Xin lỗi, tui chưa hiểu rõ ý bạn. Bạn có thể hỏi lại hoặc đặt câu hỏi khác nhé!tui lổ tai cây bà thông cảm nghen";
        }

        // ==========================================
        // CÁC HÀM XỬ LÝ GIAO DIỆN (Không cần sửa)
        // ==========================================
        function appendMessage(text, sender) {
            const chatBox = document.getElementById('chatBox');
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message');
            if (sender === 'user') {
                messageDiv.classList.add('user-message');
            } else {
                messageDiv.classList.add('bot-message');
            }
            messageDiv.textContent = text;
            chatBox.appendChild(messageDiv);
            chatBox.scrollTop = chatBox.scrollHeight; // Tự động cuộn xuống tin nhắn mới nhất
        }

        function sendMessage() {
            const inputField = document.getElementById('userInput');
            const text = inputField.value;
            if (text.trim() === "") return;

            // Hiển thị tin nhắn của người dùng
            appendMessage(text, 'user');
            inputField.value = "";

            // Tạo độ trễ giả lập bot đang suy nghĩ (0.5 giây)
            setTimeout(() => {
                const response = getBotResponse(text);
                appendMessage(response, 'bot');
            }, 500);
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
    </script>
</body>
</html>
